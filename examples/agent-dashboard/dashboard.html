<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Agent Dashboard</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e4e1d8; --text: #1f1e1c; --muted: #6f6c64;
    --accent: #c96442; --work: #2f7d4f; --wait: #b7791f; --idle: #8a877f; --err: #b3392f;
    --chip: #f1efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1917; --panel: #232220; --line: #34322e; --text: #ecebe6; --muted: #9c998f;
      --accent: #e08a68; --work: #5cc489; --wait: #e0a845; --idle: #7d7a72; --err: #e66b5f;
      --chip: #2c2b28;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--chip); color: var(--text); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .session { padding: 14px 16px; margin-bottom: 14px; }
  .s-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .s-name { font-weight: 650; font-size: 15px; }
  .s-path { color: var(--muted); font-size: 12px; word-break: break-all; }
  .prompt { margin: 10px 0 12px; padding: 8px 10px; background: var(--chip); border-radius: 6px;
            border-left: 3px solid var(--accent); white-space: pre-wrap; word-break: break-word;
            max-height: 6.5em; overflow: hidden; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .st-working { color: var(--work); } .st-waiting { color: var(--wait); }
  .st-idle, .st-done, .st-ended { color: var(--idle); } .st-quiet { color: var(--muted); }
  .agents { display: grid; gap: 8px; }
  .agent { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: start;
           padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .agent.sub { margin-left: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); margin-top: 5px; }
  .dot.working { background: var(--work); animation: pulse 1.2s ease-in-out infinite; }
  .dot.waiting { background: var(--wait); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--work) 60%, transparent); }
                     50% { box-shadow: 0 0 0 5px transparent; } }
  .a-name { font-weight: 600; }
  .a-type { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .a-now { color: var(--muted); font-size: 13px; word-break: break-word; }
  .a-now code { color: var(--text); }
  .a-meta { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .feed { padding: 10px 12px; max-height: calc(100vh - 100px); overflow: auto; position: sticky; top: 76px; }
  .feed h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 2px 0 8px; }
  .f { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; word-break: break-word; }
  .f:last-child { border-bottom: 0; }
  .f-time { color: var(--muted); font-size: 11.5px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .f-who { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; }
  .tabs button.on { background: var(--chip); font-weight: 600; }
  #office { position: relative; overflow-x: auto; overflow-y: hidden; border-radius: 12px; border: 1px solid var(--line); background: #1d2a52; }
  #office canvas { display: block; margin: 0 auto; }
  .tip { position: absolute; z-index: 3; pointer-events: none; max-width: 240px; padding: 8px 10px; border-radius: 8px;
         background: rgba(24,26,33,.94); color: #f4f6fa; font-size: 12.5px; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tip span { display: block; color: #c9ccd6; word-break: break-word; }
  [hidden] { display: none !important; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .empty code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Claude Agent Dashboard</h1>
  <span class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></span>
  <span class="spacer"></span>
  <span class="conn" id="counts"></span>
  <span class="tabs"><button id="viewOffice" class="on">Office</button><button id="viewList">List</button></span>
  <button id="clearBtn" title="Forget all events on the server">Clear</button>
</header>
<main>
  <section>
    <div id="office"><canvas id="officeCanvas" aria-label="Animated office building showing your Claude agents"></canvas><div id="officeTip" class="tip" hidden></div></div>
    <div id="sessions" hidden></div>
  </section>
  <aside class="panel feed"><h2>Live activity</h2><div id="feed"></div></aside>
</main>

<script>
const sessions = new Map();   // session_id -> session state
const feed = [];              // newest last
let lastId = 0, dirty = true;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const base = p => String(p ?? '').split(/[\\/]/).filter(Boolean).pop() || p;
const isAgentTool = t => t === 'Agent' || t === 'Task';

function describeTool(name, input) {
  input = input || {};
  switch (name) {
    case 'Bash': case 'PowerShell': return ['Running', input.command];
    case 'Read': return ['Reading', base(input.file_path)];
    case 'Edit': case 'MultiEdit': return ['Editing', base(input.file_path)];
    case 'Write': return ['Writing', base(input.file_path)];
    case 'NotebookEdit': return ['Editing', base(input.notebook_path)];
    case 'Grep': return ['Searching for', input.pattern];
    case 'Glob': return ['Finding files', input.pattern];
    case 'WebFetch': return ['Fetching', input.url];
    case 'WebSearch': return ['Searching the web for', input.query];
    case 'TodoWrite': return ['Updating to-do list', ''];
    case 'Agent': case 'Task': return ['Starting agent', input.description];
  }
  if (name && name.startsWith('mcp__')) { const p = name.split('__'); return [`Using ${p[1]}`, p.slice(2).join(' ')]; }
  return [`Using ${name}`, ''];
}
const toolHtml = (name, input) => { const [verb, obj] = describeTool(name, input);
  return esc(verb) + (obj ? ' <code>' + esc(clip(obj, 140)) + '</code>' : ''); };

function getSession(e) {
  const id = e.session_id || 'unknown';
  if (!sessions.has(id)) {
    sessions.set(id, { id, cwd: e.cwd, prompt: '', status: 'idle', last: 0, started: 0,
      agents: new Map([['main', { key: 'main', name: 'Main agent', type: '', status: 'idle', now: '', tools: 0 }]]),
      byAgentId: new Map() });
  }
  const s = sessions.get(id);
  if (e.cwd) s.cwd = e.cwd;
  return s;
}

// Events from inside a subagent carry agent_id; map it to the card created by its Agent tool call.
function agentFor(s, e) {
  if (!e.agent_id) return s.agents.get('main');
  if (s.byAgentId.has(e.agent_id)) return s.agents.get(s.byAgentId.get(e.agent_id));
  const unclaimed = [...s.agents.values()].filter(a => a.key !== 'main' && !a.agentId && a.status === 'working'
    && (!e.agent_type || !a.type || a.type === e.agent_type));
  let a = unclaimed[0];
  if (!a) { a = { key: e.agent_id, name: e.agent_type || 'Subagent', type: e.agent_type || '', status: 'working', now: '', tools: 0, started: Date.now() }; s.agents.set(a.key, a); }
  a.agentId = e.agent_id; s.byAgentId.set(e.agent_id, a.key);
  return a;
}

function apply({ ts, e }) {
  const ev = e.hook_event_name, s = getSession(e), a = agentFor(s, e), main = s.agents.get('main');
  s.last = ts;
  const live = Date.now() - ts < 8000;   // older events (page reload) skip the animations
  const plain = () => { const [v, o] = describeTool(e.tool_name, e.tool_input); return v + (o ? ' ' + clip(o, 48) : ''); };
  let line = null;
  switch (ev) {
    case 'UserPromptSubmit':
      s.prompt = e.prompt || ''; s.status = 'working'; s.started = ts;
      main.status = 'working'; main.now = 'Thinking…';
      office.prompt(s, e.prompt || '', live);
      line = 'You: ' + esc(clip(e.prompt, 160)); break;
    case 'PreToolUse':
      s.status = 'working'; a.status = 'working'; a.now = toolHtml(e.tool_name, e.tool_input);
      if (isAgentTool(e.tool_name)) {
        const i = e.tool_input || {};
        s.agents.set(e.tool_use_id || ('t' + ts), { key: e.tool_use_id || ('t' + ts), name: i.description || 'Subagent',
          type: i.subagent_type || '', status: 'working', now: esc(clip(i.prompt, 160)), tools: 0, started: ts,
          background: !!i.run_in_background, parent: a.key });
        office.spawn(s, s.agents.get(e.tool_use_id || ('t' + ts)), live);
      } else office.tool(s, a, plain(), live, e.tool_name);
      line = a.now; break;
    case 'PostToolUse':
      a.tools++; a.now = a.key === 'main' ? 'Thinking…' : 'Working…';
      if (isAgentTool(e.tool_name) && s.agents.has(e.tool_use_id)) {
        const sub = s.agents.get(e.tool_use_id);
        if (!sub.background) { sub.status = 'done'; sub.now = 'Finished'; sub.ended = ts; office.done(s, sub, live); }
      }
      break;
    case 'Notification':
      s.status = 'waiting'; main.status = 'waiting'; main.now = esc(e.message || 'Waiting for you');
      office.notify(s, e.message || 'I need your OK', live);
      line = '⚠ ' + esc(e.message || 'Needs your input'); break;
    case 'SubagentStop': {
      if (a.key !== 'main') { a.status = 'done'; a.now = 'Finished'; a.ended = ts; office.done(s, a, live); }
      line = 'Agent finished: ' + esc(a.name); break; }
    case 'Stop':
      s.status = 'idle'; main.status = 'idle'; main.now = 'Done — waiting for your next message';
      for (const x of s.agents.values()) if (x.key !== 'main' && x.status === 'working' && !x.background) { x.status = 'done'; x.now = 'Finished'; office.done(s, x, live); }
      office.stop(s, live);
      line = 'Turn finished'; break;
    case 'SessionEnd':
      s.status = 'ended'; for (const x of s.agents.values()) { x.status = x.status === 'working' ? 'done' : x.status; }
      office.end(s);
      line = 'Session ended'; break;
  }
  if (line) feed.push({ ts, who: a.key === 'main' ? base(s.cwd) || 'claude' : a.name, html: line });
  if (feed.length > 300) feed.splice(0, feed.length - 300);
}

const time = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function dur(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s/60) + 'm ' + (s%60) + 's' : Math.floor(s/3600) + 'h ' + Math.floor(s%3600/60) + 'm'; }

function render() {
  const now = Date.now(), list = [...sessions.values()].sort((a, b) => b.last - a.last);
  const box = document.getElementById('sessions');
  let working = 0;
  if (!list.length) {
    box.innerHTML = `<div class="panel empty">No activity yet.<br><br>Start <code>claude</code> in PowerShell and give it a task —<br>its agents will show up here live.</div>`;
  } else {
    box.innerHTML = list.map(s => {
      let st = s.status;
      if (st === 'working' && now - s.last > 10 * 60e3) st = 'quiet';
      const agents = [...s.agents.values()].filter(a => a.key === 'main' || a.status === 'working' || now - (a.ended || 0) < 5 * 60e3);
      working += agents.filter(a => a.status === 'working' && st !== 'quiet').length;
      return `<div class="panel session">
        <div class="s-head"><span class="s-name">${esc(base(s.cwd) || 'Claude session')}</span>
          <span class="pill st-${st}">${{ working: 'Working', waiting: 'Needs you', idle: 'Idle', ended: 'Ended', quiet: 'Quiet' }[st]}</span>
          <span class="spacer"></span><span class="a-meta">updated ${time(s.last)}</span></div>
        <div class="s-path">${esc(s.cwd || '')}</div>
        ${s.prompt ? `<div class="prompt">${esc(s.prompt)}</div>` : '<div style="height:10px"></div>'}
        <div class="agents">${agents.map(a => `
          <div class="agent ${a.key === 'main' ? '' : 'sub'}">
            <span class="dot ${a.status}"></span>
            <div><span class="a-name">${esc(a.name)}</span>${a.type ? `<span class="a-type">${esc(a.type)}</span>` : ''}
              <div class="a-now">${a.now || ''}</div></div>
            <div class="a-meta">${a.tools} tool${a.tools === 1 ? '' : 's'}${a.status === 'working' && (a.started || s.started) ? '<br>' + dur(now - (a.started || s.started)) : ''}</div>
          </div>`).join('')}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('counts').textContent = `${list.length} session${list.length === 1 ? '' : 's'} · ${working} agent${working === 1 ? '' : 's'} working`;
  document.getElementById('feed').innerHTML = feed.length
    ? feed.slice().reverse().map(f => `<div class="f"><span class="f-time">${time(f.ts)}</span><span class="f-who">${esc(f.who)}</span>${f.html}</div>`).join('')
    : '<div class="a-now">Waiting for events…</div>';
  dirty = false;
  syncView();
}

function setConn(ok) {
  document.getElementById('connDot').className = 'dot ' + (ok ? 'working' : 'waiting');
  document.getElementById('connText').textContent = ok ? 'Connected' : 'Server not reachable — is server.ps1 running?';
}

async function poll() {
  try {
    const r = await fetch('/events?since=' + lastId, { cache: 'no-store' });
    const evs = await r.json();
    for (const ev of evs) { if (ev.id <= lastId) continue; lastId = ev.id; try { apply(ev); } catch (err) { console.warn(err, ev); } dirty = true; }
    setConn(true);
  } catch { setConn(false); }
  setTimeout(poll, 1000);
}

// ---------------- Office building view ----------------
// Each Claude session is one floor of a little office building. Agents ride the
// elevator, walk over to each other, talk in speech bubbles and work at their desks.
const office = (() => {
  const canvas = document.getElementById('officeCanvas'), ctx = canvas.getContext('2d');
  const wrapEl = document.getElementById('office'), tip = document.getElementById('officeTip');
  const params = new URLSearchParams(location.search);

  // ---- world layout (world units; scaled to fit the page) ----
  const WW = 1400, BX0 = 140, BW = 1120, BX1 = BX0 + BW, L = x => BX0 + x;
  const FH = 270, LOBBY_H = 250, SKY_H = 210, STREET_H = 130;
  const IN0 = L(104), IN1 = L(1110);
  const SH = { x0: L(14), x1: L(98), cx: L(56) };
  const EXIT = L(140), AISLE = .97;
  const LEAD = { x: L(255), z: .42, dz: .56 };
  const VISIT = [L(352), L(410), L(468), L(526)];
  const BOARD = { x0: L(385), x1: L(575), cx: L(480) };
  const DESKS = [{ x: L(645), z: .14 }, { x: L(775), z: .14 }, { x: L(905), z: .14 }, { x: L(710), z: .86 }, { x: L(840), z: .86 }, { x: L(970), z: .86 }];
  const COFFEE = { x: L(1040), z: .32 };
  const ENTRANCE = L(1085), STAFF_DOOR = L(188), RECEPTION = L(600);
  const LOBBY = { k: 0, lobby: true };
  const PROPS = ['mug', 'plant', 'duck', 'lamp', 'papers', 'photo'];

  const SKIN = ['#f6d5bd', '#eac09e', '#d6a079', '#b57e55', '#8d5a3a', '#6b4430'];
  const HAIR = ['#2a1d15', '#5a3a22', '#8b5a2b', '#c99a52', '#e3c27a', '#a63c22', '#3b3b40', '#d9d4c7'];
  const SHIRT = ['#4f86c6', '#4aa57f', '#9a6cc8', '#d58a4a', '#d2607e', '#3fa3ad', '#b8a03a', '#6c7a89', '#e0b84f'];
  const PANTS = ['#2f3a4f', '#3d3a36', '#4b5563', '#2b4a6b', '#5a4632'];
  const WALLS = [['#ece2ce', '#cdbd9f', '#b98d5f'], ['#e1eadd', '#b9c9b2', '#a77d55'], ['#dfe6f0', '#b7c4d6', '#8f99a6'],
                 ['#f0e1dc', '#d1b5ad', '#9c7a5a'], ['#e7e0f1', '#c4b8d8', '#b08960'], ['#f1e9d4', '#d4c49c', '#8a6e50']];

  // ---- small helpers ----
  const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
  const rng = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const mixCache = new Map();
  const mix = (a, b, t) => {
    t = Math.round(Math.max(0, Math.min(1, t)) * 40) / 40;
    const key = a + b + t; let v = mixCache.get(key); if (v) return v;
    const A = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), B = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
    v = '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, '0')).join('');
    mixCache.set(key, v); return v;
  };
  const shade = (c, t) => t < 0 ? mix(c, '#000000', -t) : mix(c, '#ffffff', t);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const lc = s => s.replace(/^./, m => m.toLowerCase());
  const PI = Math.PI;
  function box(c, x, y, w, h, r = 0) { ctx.fillStyle = c; if (r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); } else ctx.fillRect(x, y, w, h); }
  function oval(c, x, y, rx, ry, a0 = 0, a1 = PI * 2) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, a0, a1); ctx.fill(); }
  function line(c, w, pts) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); }
  function poly(c, pts) { ctx.fillStyle = c; ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fill(); }
  function txt(c, font, s, x, y, align = 'left', base = 'alphabetic') { ctx.fillStyle = c; ctx.font = font; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillText(s, x, y); }
  const UI = 'system-ui, -apple-system, "Segoe UI", sans-serif';
  const HAND = '"Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';
  const ICONS = { Bash: '⌨️', PowerShell: '⌨️', Read: '📖', Edit: '✏️', MultiEdit: '✏️', Write: '📝', NotebookEdit: '📓', Grep: '🔍', Glob: '🗂️',
    WebFetch: '🌐', WebSearch: '🔎', TodoWrite: '✅', Agent: '🤝', Task: '🤝' };
  const iconFor = t => ICONS[t] || (t && t.startsWith('mcp__') ? '🔌' : '🛠️');

  // ---- state ----
  const rooms = new Map();
  let order = 0, people = [], parts = [], hits = [];
  const el = { k: 0, doors: 0, jobs: [], cur: null };
  let lay = { N: 0 }, T = {}, sc = 1, fs = 1;

  function top(k) { return k === 0 ? lay.lobbyTop : lay.floorsTop + (lay.N - k) * FH; }
  function ground(k, z) { return k === 0 ? lay.lobbyTop + 212 + z * 28 : top(k) + 222 + z * 30; }
  const kOf = loc => loc === LOBBY ? 0 : (loc.k ?? 0);
  const inBuilding = loc => loc === LOBBY || [...rooms.values()].includes(loc);
  function carBottom(k) { const a = Math.floor(k), b = Math.ceil(k), t = k - a, ga = ground(a, .5) + 4, gb = ground(b, .5) + 4; return ga + (gb - ga) * t; }

  function person(key, name, role) {
    const h = hash(key + name);
    const S = { skin: SKIN[h % SKIN.length], hair: HAIR[(h >>> 4) % HAIR.length], hs: (h >>> 8) % 6, shirt: SHIRT[(h >>> 11) % SHIRT.length],
      pants: PANTS[(h >>> 15) % PANTS.length], glasses: (h >>> 18) % 10 < 3, shoe: '#2a2a30', lanyard: SHIRT[(h >>> 21) % SHIRT.length] };
    if (role === 'lead') Object.assign(S, { shirt: '#f3efe6', blazer: '#34425f', tie: '#d9774f', pants: '#2d3446' });
    if (role === 'you') Object.assign(S, { shirt: '#59708f', hoodie: true, pants: '#2c3444', hs: 0, glasses: false, hair: '#2a1d15' });
    if (role === 'npc') Object.assign(S, { shirt: '#8a5a9e', hs: 1, hair: '#3b2414', glasses: true });
    return { key, name, role, S, loc: LOBBY, x: 0, z: .5, facing: 0, seated: false, queue: [], cur: null, bubble: null, sticky: null,

    items.push({ y: ground(k, .03), f: () => bigPlant(L(598), ground(k, .03), .8) });
    const leadOn = !!(r.lead.sticky && r.lead.seated);
    items.push({ y: ground(k, LEAD.z) - .1, f: () => chair(LEAD.x, ground(k, LEAD.z), !(r.lead.seated && r.lead.loc === r)) });
    items.push({ y: ground(k, LEAD.dz), f: () => desk(L(255), ground(k, LEAD.dz), 150, now, { lead: true, on: leadOn || r.waiting, ringing: r.waiting && r.lead.holding !== 'phone', phoneOff: r.lead.holding === 'phone' }) });
    DESKS.forEach((d, i) => {
      const key = r.desks[i], occ = key && people.find(p => p.owner === r && p.agentKey === key && !p.gone);
      const seated = occ && occ.seated && occ.loc === r && Math.abs(occ.x - (d.x + 6)) < 2;
      items.push({ y: ground(k, d.z - .13) - .1, f: () => chair(d.x + 6, ground(k, d.z - .13), !seated) });
      items.push({ y: ground(k, d.z), f: () => desk(d.x, ground(k, d.z), 92, now, { on: seated && occ.sticky, prop: r.props[i], seed: i * 5, card: seated ? occ.name : '' }) });
      if (seated && occ.sticky && Math.random() < .012) parts.push({ kind: 'glyph', x: d.x - 28, y: ground(k, d.z) - 70, vx: (Math.random() - .5) * 6, vy: -14, life: 1.8, max: 1.8, text: pick(['{ }', '</>', ';', '01', 'λ', '=>', '#']) });
    });
    people.filter(p => p.loc === r && !p.inCar).forEach(p => items.push({ y: ground(k, p.z), f: () => drawPerson(p, p.x, ground(k, p.z), .9 + p.z * .1, now) }));
    items.sort((a, b) => a.y - b.y).forEach(o => o.f());
    if (lit) lampsX.forEach(x => lightCone(x, t, .6 + T.dark * .8));
    if (!lit) box('rgba(8,10,22,.6)', IN0, t + 6, IN1 - IN0, 252);
    // idle zzz
    if (r.idleSince && now - r.idleSince > 60000 && r.lead.seated && Math.random() < .02) parts.push({ kind: 'zzz', x: r.lead.x + 10, y: ground(k, r.lead.z) - 76, vx: 6, vy: -10, life: 2.2, max: 2.2 });
  }

  // ---- lobby ----
  function drawLobby(now) {
    const t = lay.lobbyTop, k = 0;
    slab(t, 6);
    box('#ece6da', IN0, t + 6, IN1 - IN0, 204);
    for (let x = IN0; x < IN1; x += 70) { box('rgba(0,0,0,.035)', x, t + 6, 1.5, 204); box('rgba(255,255,255,.25)', x + 2, t + 6, 1, 204); }
    box('#d8cfbf', IN0, t + 170, IN1 - IN0, 40); box('rgba(0,0,0,.12)', IN0, t + 204, IN1 - IN0, 6);
    for (let y = t + 210, row = 0; y < t + 240; y += 10, row++) for (let x = IN0 + (row % 2) * 20, i = 0; x < IN1; x += 20, i++) box(i % 2 ? '#e9e4da' : '#bdb4a4', x, y, 20, 10);
    box(mix('#7d776f', '#3d3a36', T.dark * .4), BX0, t + 240, BW - 10, 10);
    floorIndicator(t, 0);
    // staff door
    box('#7a5636', STAFF_DOOR - 26, t + 110, 52, 100, 2); box('#8f6a45', STAFF_DOOR - 22, t + 114, 44, 96);
    oval('#e3c27a', STAFF_DOOR + 15, t + 162, 2.2, 2.2); box('#2d3142', STAFF_DOOR - 20, t + 92, 40, 14, 2); txt('#f4f1ea', `800 7px ${UI}`, 'AGENTS', STAFF_DOOR, t + 102, 'center');
    // directory board
    const dx = L(250), dy = t + 64, list = [...rooms.values()].sort((a, b) => b.k - a.k);
    box('#2d3142', dx, dy, 120, 110, 4); box('#3d4256', dx + 4, dy + 4, 112, 102, 3);
    txt('#e3c27a', `800 8px ${UI}`, 'DIRECTORY', dx + 60, dy + 16, 'center');
    list.slice(0, 7).forEach((r, i) => {
      const s = sessions.get(r.sid) || {}, c = { working: '#4ade80', waiting: '#fbbf24', ended: '#4b5563' }[s.status] || '#9ca3af';
      txt('#ffffff', `700 8px ${UI}`, r.k + 'F', dx + 10, dy + 32 + i * 11); txt('#d7dae2', `8px ${UI}`, clip(base(s.cwd) || 'session', 15), dx + 28, dy + 32 + i * 11);
      oval(c, dx + 108, dy + 29 + i * 11, 3, 3);
    });
    if (!list.length) txt('#9aa1aa', `8px ${UI}`, 'No one in yet', dx + 60, dy + 40, 'center');
    txt('#9aa1aa', `8px ${UI}`, 'L  Lobby', dx + 10, dy + 100);
    // logo wall
    ctx.save(); ctx.translate(RECEPTION - 70, t + 62); ctx.strokeStyle = '#d9774f'; ctx.lineWidth = 4; ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) { ctx.rotate(PI / 4); ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(0, 16); ctx.stroke(); }
    ctx.restore();
    txt('#3d3a36', `800 26px ${UI}`, 'CLAUDE HQ', RECEPTION + 14, t + 72, 'center');
    txt('#8a8478', `600 9px ${UI}`, 'AGENTS AT WORK SINCE TODAY', RECEPTION + 14, t + 88, 'center');
    clock(L(780), t + 70, 15);
    // bench, plants, frames
    box('#6b4a2f', L(420) - 40, ground(0, 0) - 20, 80, 6, 2); box('#4a3220', L(420) - 36, ground(0, 0) - 14, 4, 14); box('#4a3220', L(420) + 32, ground(0, 0) - 14, 4, 14);
    [[L(850), '#4f86c6'], [L(905), '#9bbb59'], [L(960), '#e46c0a']].forEach(([x, c]) => { box('#3a3e46', x - 20, t + 50, 40, 52, 2); box(c, x - 16, t + 54, 32, 44); oval('rgba(255,255,255,.35)', x - 4, t + 70, 9, 9); });
    const items = [];
    items.push({ y: ground(0, .02), f: () => bigPlant(L(340), ground(0, .02), 1.1) });
    items.push({ y: ground(0, .04), f: () => bigPlant(L(1010), ground(0, .04), 1.2) });
    items.push({ y: ground(0, .36) - .1, f: () => chair(RECEPTION, ground(0, .36), false) });
    items.push({ y: ground(0, .55), f: () => {
      const y = ground(0, .55);
      box('#5e4129', RECEPTION - 92, y - 40, 184, 40, 6); box('#7a5636', RECEPTION - 88, y - 36, 176, 32, 4);
      box('#e8e2d0', RECEPTION - 96, y - 46, 192, 8, 3);
      txt('#e3c27a', `800 9px ${UI}`, 'RECEPTION', RECEPTION, y - 16, 'center');
      monitor(RECEPTION - 60, y - 46, true, 1, now, 9); oval('#d9c36a', RECEPTION + 50, y - 49, 5, 3); box('#b39b4a', RECEPTION + 49, y - 54, 2, 4);
      prop('plant', RECEPTION + 74, y - 46, now);
    } });
    people.filter(p => p.loc === LOBBY && !p.inCar).forEach(p => items.push({ y: ground(0, p.z), f: () => drawPerson(p, p.x, ground(0, p.z), .9 + p.z * .1, now) }));
    items.sort((a, b) => a.y - b.y).forEach(o => o.f());
    [L(300), L(600), L(900)].forEach(x => { lampFixture(x, t, true); lightCone(x, t, .5 + T.dark * .6); });
    if (!rooms.size) reception.sticky = { icon: '👀', text: 'Waiting for someone to start claude…' };
    else if (reception.sticky && reception.sticky.icon === '👀') reception.sticky = null;
  }

  // ---- speech bubbles, status chips, particles ----
  function talkBubble(x, y, text) {
    ctx.font = `600 ${11 * fs}px ${UI}`;
    const lines = wrapText(text, 170 * fs, 3), lh = 13.5 * fs;
    const w = Math.max(...lines.map(l => ctx.measureText(l).width)) + 18, h = lines.length * lh + 11;
    const bx = Math.min(Math.max(x - w / 2, BX0 + 4), BX1 - w - 4), by = y - h - 9;
    box('rgba(0,0,0,.18)', bx + 2, by + 3, w, h, 10);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#2b2b30'; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.roundRect(bx, by, w, h, 10); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 5, by + h - .7); ctx.lineTo(x - 1, by + h + 8); ctx.lineTo(x + 6, by + h - .7); ctx.fill();
    line('#2b2b30', 1.3, [[x - 5, by + h], [x - 1, by + h + 8], [x + 6, by + h]]);
    lines.forEach((l, i) => txt('#1f1e1c', `600 ${11 * fs}px ${UI}`, l, bx + 9, by + 6 + i * lh, 'left', 'top'));
  }
  function chip(x, y, text) {
    ctx.font = `${9.5 * fs}px ${UI}`;
    const s = clip(text, 46), w = ctx.measureText(s).width + 14, h = 15 * fs;
    const bx = Math.min(Math.max(x - w / 2, BX0 + 4), BX1 - w - 4), by = y - h - 9;
    box('rgba(28,31,40,.82)', bx, by, w, h, h / 2);
    oval('rgba(28,31,40,.82)', x, by + h + 3, 2.4, 2.4); oval('rgba(28,31,40,.82)', x + 2, by + h + 7.5, 1.4, 1.4);
    txt('#f4f6fa', `${9.5 * fs}px ${UI}`, s, bx + 7, by + h / 2 + .5, 'left', 'middle');
  }
  function drawBubbles(now) {
    for (const p of people) {
      if (p.alpha < .5) continue;
      const k = kOf(p.loc), s = .9 + p.z * .1, Y = p.inCar ? carBottom(el.k) - 2 : ground(k, p.z);
      const headTop = Y - (p.seated && !p.inCar ? 80 : 90) * s;
      if (p.bubble) talkBubble(p.x, headTop, p.bubble.text);
      else if (p.sticky && !p.inCar && (p.seated || p.role === 'lead')) chip(p.x, headTop, p.sticky.icon + ' ' + p.sticky.text);
      if (p.role === 'lead' && p.owner && p.owner.waiting) {
        const bx = p.x + 20, by = headTop - 8 + Math.sin(now / 140) * 3;
        oval('#fbbf24', bx, by, 8, 8); txt('#3a2a00', `900 12px ${UI}`, '!', bx, by + 4.5, 'center');
      }
    }
  }
  function stepParts(dt) {
    for (const q of parts) {
      q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt;
      if (q.kind === 'conf') { q.vy += 260 * dt; q.rot += dt * 8; }
      else q.vx = Math.sin(q.life * 3) * 5;
    }
    parts = parts.filter(q => q.life > 0);
    if (parts.length > 400) parts = parts.slice(-400);
  }
  function drawParts() {
    for (const q of parts) {
      const a = Math.max(0, q.life / q.max); ctx.globalAlpha = a;
      if (q.kind === 'conf') { ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); box(q.color, -2.5, -1.5, 5, 3); ctx.restore(); }
      else if (q.kind === 'steam') oval('rgba(255,255,255,.65)', q.x, q.y, 1.5 + (1 - a) * 4, 1.5 + (1 - a) * 4);
      else if (q.kind === 'glyph') txt('#4f86c6', `700 8px ui-monospace, Consolas, monospace`, q.text, q.x, q.y, 'center');
      else if (q.kind === 'zzz') txt('#6c7a89', `800 ${8 + (1 - a) * 9}px ${UI}`, 'z', q.x, q.y, 'center');
    }
    ctx.globalAlpha = 1;
  }

  // ---- main loop ----
  let prev = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - prev) / 1000); prev = now;
    const list = [...rooms.values()].sort((a, b) => a.order - b.order);
    list.forEach((r, i) => { r.k = i + 1; });
    lay.N = list.length; lay.floorsTop = SKY_H + 34; lay.lobbyTop = lay.floorsTop + lay.N * FH;
    lay.streetTop = lay.lobbyTop + LOBBY_H; lay.H = lay.streetTop + STREET_H;
    sky();
    for (const p of people) stepP(p, dt, now);
    stepEl(dt);
    people = people.filter(p => !p.gone);
    clouds.forEach(c => { c.x += c.v * dt; if (c.x > WW + 90) c.x = -90; });
    stepParts(dt);
    for (const r of list) if (r.ended && Date.now() - r.endedAt > 6e5) { rooms.delete(r.sid); people = people.filter(p => p.owner !== r); }
    if (!canvas.offsetParent) { requestAnimationFrame(frame); return; }

    const W = wrapEl.clientWidth;
    sc = Math.min(1.25, Math.max(W / WW, W < 700 ? .52 : 0));
    fs = Math.min(1.7, Math.max(1, .72 / sc));
    const cssW = Math.round(WW * sc), cssH = Math.round(lay.H * sc), dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(cssW * dpr) || canvas.height !== Math.round(cssH * dpr)) {
      canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
      canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    }
    ctx.setTransform(dpr * sc, 0, 0, dpr * sc, 0, 0);
    hits = [];
    drawSky(now); drawCity();
    tree(58, lay.streetTop, 1); tree(WW - 60, lay.streetTop, 1.1);
    lamp(112, lay.streetTop, -1); lamp(WW - 112, lay.streetTop, 1);
    drawStreet(now, dt);
    if (T.dark > 0) box(`rgba(6,10,30,${T.dark * .22})`, 0, 0, WW, lay.H);
    drawShell(now); drawRoof(now); drawShaft(now);
    drawLobby(now);
    list.forEach(r => drawFloor(r, now));
    drawParts(); drawBubbles(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---- hover details ----
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect(), x = (e.clientX - rect.left) / sc, y = (e.clientY - rect.top) / sc;
    const h = [...hits].reverse().find(h => x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1);
    if (!h) { tip.hidden = true; canvas.style.cursor = ''; return; }
    const p = h.p, ses = p.owner && sessions.get(p.owner.sid);
    const a = p.role === 'lead' ? ses && ses.agents.get('main') : p.agent;
    const title = p.role === 'lead' ? (base(ses && ses.cwd) || 'Session') + ' · lead agent' : p.name;
    const role = { lead: 'Runs this floor and hands out tasks', worker: (a && a.type ? a.type : 'helper') + ' agent', you: 'That’s you!', npc: 'Front desk' }[p.role];
    const doing = p.bubble ? '“' + p.bubble.text + '”' : p.sticky ? p.sticky.icon + ' ' + p.sticky.text : p.role === 'npc' ? 'Greeting visitors' : 'Walking around';
    tip.innerHTML = `<b>${esc(title)}</b><span>${esc(role)}</span><span>${esc(doing)}</span>` + (a ? `<span>${a.tools} tool use${a.tools === 1 ? '' : 's'}</span>` : '');
    const wr = wrapEl.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - wr.left + wrapEl.scrollLeft + 14, wrapEl.scrollWidth - 250) + 'px';
    tip.style.top = (e.clientY - wr.top + 14) + 'px';
    tip.hidden = false; canvas.style.cursor = 'help';
  });
  canvas.addEventListener('mouseleave', () => { tip.hidden = true; });

  return api;
})();

let view = 'office';
try { view = localStorage.getItem('dash-view') || 'office'; } catch {}
function setView(v) {
  view = v; try { localStorage.setItem('dash-view', v); } catch {}
  document.getElementById('viewOffice').classList.toggle('on', v === 'office');
  document.getElementById('viewList').classList.toggle('on', v === 'list');
  syncView();
}
function syncView() {
  const showOffice = view === 'office';
  document.getElementById('office').hidden = !showOffice;
  document.getElementById('sessions').hidden = showOffice;
}
document.getElementById('viewOffice').onclick = () => setView('office');
document.getElementById('viewList').onclick = () => setView('list');
setView(view);

document.getElementById('clearBtn').onclick = async () => {
  if (!confirm('Clear all recorded activity?')) return;
  await fetch('/clear', { method: 'POST' }).catch(() => {});
  sessions.clear(); feed.length = 0; lastId = 0; dirty = true; office.clear();
};
setInterval(() => render(), 1000);   // also refreshes timers
poll(); render();
</script>
</body>
