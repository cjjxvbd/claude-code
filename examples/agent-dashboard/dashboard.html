<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Agent Dashboard</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e4e1d8; --text: #1f1e1c; --muted: #6f6c64;
    --accent: #c96442; --work: #2f7d4f; --wait: #b7791f; --idle: #8a877f; --err: #b3392f;
    --chip: #f1efe8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1917; --panel: #232220; --line: #34322e; --text: #ecebe6; --muted: #9c998f;
      --accent: #e08a68; --work: #5cc489; --wait: #e0a845; --idle: #7d7a72; --err: #e66b5f;
      --chip: #2c2b28;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
           position: sticky; top: 0; z-index: 2; }
  h1 { font-size: 17px; margin: 0; font-weight: 650; }
  .conn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .spacer { flex: 1; }
  button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 6px; cursor: pointer;
           border: 1px solid var(--line); background: var(--chip); color: var(--text); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .session { padding: 14px 16px; margin-bottom: 14px; }
  .s-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .s-name { font-weight: 650; font-size: 15px; }
  .s-path { color: var(--muted); font-size: 12px; word-break: break-all; }
  .prompt { margin: 10px 0 12px; padding: 8px 10px; background: var(--chip); border-radius: 6px;
            border-left: 3px solid var(--accent); white-space: pre-wrap; word-break: break-word;
            max-height: 6.5em; overflow: hidden; }
  .pill { font-size: 12px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
  .st-working { color: var(--work); } .st-waiting { color: var(--wait); }
  .st-idle, .st-done, .st-ended { color: var(--idle); } .st-quiet { color: var(--muted); }
  .agents { display: grid; gap: 8px; }
  .agent { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 10px; align-items: start;
           padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .agent.sub { margin-left: 18px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--idle); margin-top: 5px; }
  .dot.working { background: var(--work); animation: pulse 1.2s ease-in-out infinite; }
  .dot.waiting { background: var(--wait); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--work) 60%, transparent); }
                     50% { box-shadow: 0 0 0 5px transparent; } }
  .a-name { font-weight: 600; }
  .a-type { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .a-now { color: var(--muted); font-size: 13px; word-break: break-word; }
  .a-now code { color: var(--text); }
  .a-meta { color: var(--muted); font-size: 12px; text-align: right; white-space: nowrap; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .feed { padding: 10px 12px; max-height: calc(100vh - 100px); overflow: auto; position: sticky; top: 76px; }
  .feed h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 2px 0 8px; }
  .f { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; word-break: break-word; }
  .f:last-child { border-bottom: 0; }
  .f-time { color: var(--muted); font-size: 11.5px; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .f-who { color: var(--accent); font-weight: 600; margin-right: 4px; }
  .tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .tabs button { border: 0; border-radius: 0; background: transparent; }
  .tabs button.on { background: var(--chip); font-weight: 600; }
  #office { position: relative; overflow-x: auto; overflow-y: hidden; border-radius: 12px; border: 1px solid var(--line); background: #1d2a52; }
  #office canvas, #station canvas { display: block; margin: 0 auto; }
  #station { position: relative; overflow-x: auto; overflow-y: hidden; border-radius: 12px; border: 1px solid #1d4d36; background: #03070a; }
  main.full { grid-template-columns: minmax(0, 1fr); }
  #galaxy { position: relative; height: min(80vh, 860px); min-height: 520px; border-radius: 12px; overflow: hidden; background: #010206; border: 1px solid #1c2840;
            font-family: Consolas, "Cascadia Mono", ui-monospace, Menlo, monospace; color: #d7ffe9; }
  #galaxyCanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #galaxyLabels { position: absolute; inset: 0; pointer-events: none; }
  .gl-tag { pointer-events: none; text-align: center; white-space: nowrap; text-shadow: 0 0 6px #000, 0 0 2px #000; }
  .gl-tag b { display: block; font-size: 12px; letter-spacing: .06em; }
  .gl-planet { background: rgba(4,10,20,.5); border: 1px solid rgba(120,200,255,.2); border-radius: 6px; padding: 3px 7px; max-width: 200px; white-space: normal; }
  .gl-planet b { font-size: 11.5px; } .gl-planet span { font-size: 10px !important; }
  .gl-planet i { display: inline-block; font-style: normal; font-size: 10px; border: 1px solid; border-radius: 99px; padding: 0 6px; margin: 2px 0; letter-spacing: .08em; }
  .gl-planet span { display: block; font-size: 11px; color: #cfe3ff; }
  .gl-planet span.s { color: #9fe8ff; }
  .gl-planet em { display: block; font-size: 10.5px; color: #8fa3bf; }
  .gl-core b { color: #ffc9a8; font-size: 12px; } .gl-core span { font-size: 10px; color: #ffb38a; }
  .gl-you b { color: #fff; letter-spacing: .2em; }
  .gl-svc b { font-size: 11px; } .gl-svc .n { font-size: 10px; color: #8fa3bf; }
  .gl-ship { font-size: 10px; font-weight: 700; }
  .gl-float { font-size: 11px; font-weight: 700; background: rgba(0,0,0,.55); padding: 1px 6px; border-radius: 4px; }
  .gl-hud { position: absolute; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; pointer-events: none; flex-wrap: wrap;
            background: linear-gradient(rgba(1,2,6,.85), rgba(1,2,6,0)); }
  .gl-title b { position: relative; font-size: 16px; letter-spacing: .14em; color: #fff; text-shadow: 0 0 10px #ff8a5c; animation: glitch 6s infinite steps(1); }
  .gl-title b::before, .gl-title b::after { content: attr(data-text); position: absolute; left: 0; top: 0; opacity: 0; }
  .gl-title b::before { color: #39ff88; animation: gl1 6s infinite steps(1); } .gl-title b::after { color: #ff3df2; animation: gl2 6s infinite steps(1); }
  @keyframes gl1 { 0%, 91%, 100% { opacity: 0; transform: none; } 92% { opacity: .8; transform: translate(-3px, 1px); } 94% { opacity: .8; transform: translate(2px, -1px); } }
  @keyframes gl2 { 0%, 91%, 100% { opacity: 0; transform: none; } 93% { opacity: .8; transform: translate(3px, -1px); } 95% { opacity: .8; transform: translate(-2px, 1px); } }
  #glStats { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: #8fa3bf; }
  #glStats b { color: #fff; font-size: 13px; } #glStats .warn b, #glStats .warn { color: #ffb020; }
  .gl-btns { display: flex; gap: 6px; pointer-events: auto; align-items: flex-start; }
  .gl-btns button { background: rgba(10,18,32,.75); color: #cfe3ff; border: 1px solid #2b3d5c; font: inherit; font-size: 12px; }
  .gl-btns button.on { border-color: #39ff88; color: #39ff88; }
  #glTicker { position: absolute; left: 0; right: 0; bottom: 0; padding: 9px 14px; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              background: linear-gradient(rgba(1,2,6,0), rgba(1,2,6,.9)); pointer-events: none; }
  #glTicker i { color: #3b4c6b; margin: 0 10px; font-style: normal; }
  #glToast { position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0) scale(.9); text-align: center; opacity: 0; pointer-events: none; }
  #glToast b { display: block; font-size: clamp(18px, 3vw, 30px); letter-spacing: .2em; text-shadow: 0 0 18px currentColor; }
  #glToast span { display: block; margin-top: 6px; font-size: 13px; color: #cfe3ff; max-width: 70vw; }
  #glToast.show { animation: toast 2.6s ease-out forwards; }
  @keyframes toast { 0% { opacity: 0; transform: translate(-50%, 0) scale(1.4); filter: blur(6px); } 8% { opacity: 1; transform: translate(-50%, 0) scale(1); filter: none; }
                     12% { transform: translate(calc(-50% + 4px), 0); } 14% { transform: translate(calc(-50% - 4px), 0); } 16% { transform: translate(-50%, 0); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #glLoading { position: absolute; inset: 0; display: grid; place-items: center; color: #8fa3bf; font-size: 13px; background: #010206; }
  .gl-hint { position: absolute; right: 14px; bottom: 34px; font-size: 10.5px; color: #4d5f7d; pointer-events: none; }
  @media (max-width: 700px) { .gl-hint { display: none; } #galaxy { height: 72vh; } }
  main.full .feed { display: none; }
  .tip { position: absolute; z-index: 3; pointer-events: none; max-width: 240px; padding: 8px 10px; border-radius: 8px;
         background: rgba(24,26,33,.94); color: #f4f6fa; font-size: 12.5px; line-height: 1.35; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tip span { display: block; color: #c9ccd6; word-break: break-word; }
  [hidden] { display: none !important; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  .empty code { background: var(--chip); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header>
  <h1>Claude Agent Dashboard</h1>
  <span class="conn"><span class="dot" id="connDot"></span><span id="connText">Connecting…</span></span>
  <span class="spacer"></span>
  <span class="conn" id="counts"></span>
  <span class="tabs"><button id="viewGalaxy" class="on">Galaxy</button><button id="viewStation">Command</button><button id="viewOffice">Office</button><button id="viewList">List</button></span>
  <button id="clearBtn" title="Forget all events on the server">Clear</button>
</header>
<main>
  <section>
    <div id="galaxy">
      <canvas id="galaxyCanvas" aria-label="3D galaxy of your Claude sessions and agents"></canvas>
      <div id="galaxyLabels"></div>
      <div class="gl-hud">
        <div class="gl-title"><b data-text="CLAUDE // AGENT GALAXY">CLAUDE // AGENT GALAXY</b><div id="glStats"></div></div>
        <div class="gl-btns"><button id="glSound">🔈 Sound off</button><button id="glSpin" class="on">✦ Auto-orbit</button><button id="glReset">⟲ Reset view</button></div>
      </div>
      <div id="glToast"></div>
      <div id="glTicker"><span>Waiting for activity… start <b>claude</b> in PowerShell.</span></div>
      <div id="glLoading">Warming up the galaxy…</div>
      <div class="gl-hint">Drag to rotate · scroll to zoom · click a planet to fly to it</div>
    </div>
    <div id="station"><canvas id="stationCanvas" aria-label="Sci-fi command map of your Claude sessions and agents"></canvas><div id="stationTip" class="tip" hidden></div></div>
    <div id="office"><canvas id="officeCanvas" aria-label="Animated office building showing your Claude agents"></canvas><div id="officeTip" class="tip" hidden></div></div>
    <div id="sessions" hidden></div>
  </section>
  <aside class="panel feed"><h2>Live activity</h2><div id="feed"></div></aside>
</main>

<script>
const sessions = new Map();   // session_id -> session state
const feed = [];              // newest last
let lastId = 0, dirty = true;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clip = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
const base = p => String(p ?? '').split(/[\\/]/).filter(Boolean).pop() || p;
const isAgentTool = t => t === 'Agent' || t === 'Task';

function describeTool(name, input) {
  input = input || {};
  switch (name) {
    case 'Bash': case 'PowerShell': return ['Running', input.command];
    case 'Read': return ['Reading', base(input.file_path)];
    case 'Edit': case 'MultiEdit': return ['Editing', base(input.file_path)];
    case 'Write': return ['Writing', base(input.file_path)];
    case 'NotebookEdit': return ['Editing', base(input.notebook_path)];
    case 'Grep': return ['Searching for', input.pattern];
    case 'Glob': return ['Finding files', input.pattern];
    case 'WebFetch': return ['Fetching', input.url];
    case 'WebSearch': return ['Searching the web for', input.query];
    case 'TodoWrite': return ['Updating to-do list', ''];
    case 'Agent': case 'Task': return ['Starting agent', input.description];
  }
  if (name && name.startsWith('mcp__')) { const p = name.split('__'); return [`Using ${p[1]}`, p.slice(2).join(' ')]; }
  return [`Using ${name}`, ''];
}
const toolHtml = (name, input) => { const [verb, obj] = describeTool(name, input);
  return esc(verb) + (obj ? ' <code>' + esc(clip(obj, 140)) + '</code>' : ''); };

function getSession(e) {
  const id = e.session_id || 'unknown';
  if (!sessions.has(id)) {
    sessions.set(id, { id, cwd: e.cwd, prompt: '', status: 'idle', last: 0, started: 0,
      agents: new Map([['main', { key: 'main', name: 'Main agent', type: '', status: 'idle', now: '', tools: 0 }]]),
      byAgentId: new Map() });
  }
  const s = sessions.get(id);
  if (e.cwd) s.cwd = e.cwd;
  return s;
}

// Events from inside a subagent carry agent_id; map it to the card created by its Agent tool call.
function agentFor(s, e) {
  if (!e.agent_id) return s.agents.get('main');
  if (s.byAgentId.has(e.agent_id)) return s.agents.get(s.byAgentId.get(e.agent_id));
  const unclaimed = [...s.agents.values()].filter(a => a.key !== 'main' && !a.agentId && a.status === 'working'
    && (!e.agent_type || !a.type || a.type === e.agent_type));
  let a = unclaimed[0];
  if (!a) { a = { key: e.agent_id, name: e.agent_type || 'Subagent', type: e.agent_type || '', status: 'working', now: '', tools: 0, started: Date.now() }; s.agents.set(a.key, a); }
  a.agentId = e.agent_id; s.byAgentId.set(e.agent_id, a.key);
  return a;
}

function apply({ ts, e }) {
  const ev = e.hook_event_name, s = getSession(e), a = agentFor(s, e), main = s.agents.get('main');
  s.last = ts;
  const live = Date.now() - ts < 8000;   // older events (page reload) skip the animations
  const plain = () => { const [v, o] = describeTool(e.tool_name, e.tool_input); return v + (o ? ' ' + clip(o, 48) : ''); };
  let line = null;
  switch (ev) {
    case 'UserPromptSubmit':
      s.prompt = e.prompt || ''; s.status = 'working'; s.started = ts;
      main.status = 'working'; main.now = 'Thinking…';
      scene.prompt(s, e.prompt || '', live);
      line = 'You: ' + esc(clip(e.prompt, 160)); break;
    case 'PreToolUse':
      s.status = 'working'; a.status = 'working'; a.now = toolHtml(e.tool_name, e.tool_input);
      if (isAgentTool(e.tool_name)) {
        const i = e.tool_input || {};
        s.agents.set(e.tool_use_id || ('t' + ts), { key: e.tool_use_id || ('t' + ts), name: i.description || 'Subagent',
          type: i.subagent_type || '', status: 'working', now: esc(clip(i.prompt, 160)), tools: 0, started: ts,
          background: !!i.run_in_background, parent: a.key });
        scene.spawn(s, s.agents.get(e.tool_use_id || ('t' + ts)), live);
      } else scene.tool(s, a, plain(), live, e.tool_name);
      line = a.now; break;
    case 'PostToolUse':
      a.tools++; a.now = a.key === 'main' ? 'Thinking…' : 'Working…';
      if (isAgentTool(e.tool_name) && s.agents.has(e.tool_use_id)) {
        const sub = s.agents.get(e.tool_use_id);
        if (!sub.background) { sub.status = 'done'; sub.now = 'Finished'; sub.ended = ts; scene.done(s, sub, live); }
      }
      break;
    case 'Notification':
      s.status = 'waiting'; main.status = 'waiting'; main.now = esc(e.message || 'Waiting for you');
      scene.notify(s, e.message || 'I need your OK', live);
      line = '⚠ ' + esc(e.message || 'Needs your input'); break;
    case 'SubagentStop': {
      if (a.key !== 'main') { a.status = 'done'; a.now = 'Finished'; a.ended = ts; scene.done(s, a, live); }
      line = 'Agent finished: ' + esc(a.name); break; }
    case 'Stop':
      s.status = 'idle'; main.status = 'idle'; main.now = 'Done — waiting for your next message';
      for (const x of s.agents.values()) if (x.key !== 'main' && x.status === 'working' && !x.background) { x.status = 'done'; x.now = 'Finished'; scene.done(s, x, live); }
      scene.stop(s, live);
      line = 'Turn finished'; break;
    case 'SessionEnd':
      s.status = 'ended'; for (const x of s.agents.values()) { x.status = x.status === 'working' ? 'done' : x.status; }
      scene.end(s);
      line = 'Session ended'; break;
  }
  if (line) feed.push({ ts, who: a.key === 'main' ? base(s.cwd) || 'claude' : a.name, html: line });
  if (feed.length > 300) feed.splice(0, feed.length - 300);
}

const time = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
function dur(ms) { const s = Math.max(0, Math.round(ms / 1000)); return s < 60 ? s + 's' : s < 3600 ? Math.floor(s/60) + 'm ' + (s%60) + 's' : Math.floor(s/3600) + 'h ' + Math.floor(s%3600/60) + 'm'; }

function render() {
  const now = Date.now(), list = [...sessions.values()].sort((a, b) => b.last - a.last);
  const box = document.getElementById('sessions');
  let working = 0;
  if (!list.length) {
    box.innerHTML = `<div class="panel empty">No activity yet.<br><br>Start <code>claude</code> in PowerShell and give it a task —<br>its agents will show up here live.</div>`;
  } else {
    box.innerHTML = list.map(s => {
      let st = s.status;
      if (st === 'working' && now - s.last > 10 * 60e3) st = 'quiet';
      const agents = [...s.agents.values()].filter(a => a.key === 'main' || a.status === 'working' || now - (a.ended || 0) < 5 * 60e3);
      working += agents.filter(a => a.status === 'working' && st !== 'quiet').length;
      return `<div class="panel session">
        <div class="s-head"><span class="s-name">${esc(base(s.cwd) || 'Claude session')}</span>
          <span class="pill st-${st}">${{ working: 'Working', waiting: 'Needs you', idle: 'Idle', ended: 'Ended', quiet: 'Quiet' }[st]}</span>
          <span class="spacer"></span><span class="a-meta">updated ${time(s.last)}</span></div>
        <div class="s-path">${esc(s.cwd || '')}</div>
        ${s.prompt ? `<div class="prompt">${esc(s.prompt)}</div>` : '<div style="height:10px"></div>'}
        <div class="agents">${agents.map(a => `
          <div class="agent ${a.key === 'main' ? '' : 'sub'}">
            <span class="dot ${a.status}"></span>
            <div><span class="a-name">${esc(a.name)}</span>${a.type ? `<span class="a-type">${esc(a.type)}</span>` : ''}
              <div class="a-now">${a.now || ''}</div></div>
            <div class="a-meta">${a.tools} tool${a.tools === 1 ? '' : 's'}${a.status === 'working' && (a.started || s.started) ? '<br>' + dur(now - (a.started || s.started)) : ''}</div>
          </div>`).join('')}</div>
      </div>`;
    }).join('');
  }
  document.getElementById('counts').textContent = `${list.length} session${list.length === 1 ? '' : 's'} · ${working} agent${working === 1 ? '' : 's'} working`;
  document.getElementById('feed').innerHTML = feed.length
    ? feed.slice().reverse().map(f => `<div class="f"><span class="f-time">${time(f.ts)}</span><span class="f-who">${esc(f.who)}</span>${f.html}</div>`).join('')
    : '<div class="a-now">Waiting for events…</div>';
  dirty = false;
  syncView();
}

function setConn(ok) {
  document.getElementById('connDot').className = 'dot ' + (ok ? 'working' : 'waiting');
  document.getElementById('connText').textContent = ok ? 'Connected' : 'Server not reachable — is server.ps1 running?';
}

async function poll() {
  try {
    const r = await fetch('/events?since=' + lastId, { cache: 'no-store' });
    const evs = await r.json();
    for (const ev of evs) { if (ev.id <= lastId) continue; lastId = ev.id; try { apply(ev); } catch (err) { console.warn(err, ev); } dirty = true; }
    setConn(true);
  } catch { setConn(false); }
  setTimeout(poll, 1000);
}

// ---------------- Office building view ----------------
// Each Claude session is one floor of a little office building. Agents ride the
// elevator, walk over to each other, talk in speech bubbles and work at their desks.
const office = (() => {
  const canvas = document.getElementById('officeCanvas'), ctx = canvas.getContext('2d');
  const wrapEl = document.getElementById('office'), tip = document.getElementById('officeTip');
  const params = new URLSearchParams(location.search);

  // ---- world layout (world units; scaled to fit the page) ----
  const WW = 1400, BX0 = 140, BW = 1120, BX1 = BX0 + BW, L = x => BX0 + x;
  const FH = 270, LOBBY_H = 250, SKY_H = 210, STREET_H = 130;
  const IN0 = L(104), IN1 = L(1110);

  // ---- geometry ----

  // ---- rooms ----

    else {
      S.t = Math.min(1, S.t + dt / S.dur);
      const e = S.t < .5 ? 2 * S.t * S.t : 1 - Math.pow(-2 * S.t + 2, 2) / 2;
      const dest = S.state === 'fly' ? orbitPos(S, tmp) : SVC.hangar.g.position;
      bez(S.from, dest, 26, e, S.obj.position);
      if (S.t >= 1) { if (S.state === 'fly') { S.state = 'orbit'; wave(S.P.pos, S.color, 14); } else { sparks(S.obj.position, S.color, 40, 14); removeShip(S); continue; } }
    }
    if (before.distanceToSquared(S.obj.position) > 1e-6) S.obj.lookAt(tmp.copy(S.obj.position).multiplyScalar(2).sub(before));
    S.trail.push(S.obj.position);
  }
  // beams
  for (const B of beams) {
    B.t = Math.min(1, B.t + dt / B.dur); const e = 1 - Math.pow(1 - B.t, 2);
    bez(B.from(), B.to(), B.lift, e, B.head.position); B.trail.push(B.head.position);
    if (B.t >= 1 && !B.done) { B.done = true; B.fade = .35; if (B.then) B.then(); }
    if (B.done) { B.fade -= dt; B.head.scale.setScalar(Math.max(.01, B.fade / .35)); B.trail.push(B.head.position); }
  }
  beams = beams.filter(B => { if (B.done && B.fade <= 0) { scene.remove(B.head); B.trail.dispose(); return false; } return true; });
  for (const b of bursts) { b.life -= dt; const p = b.pts.geometry.attributes.position; b.v.forEach((v, i) => { p.setXYZ(i, p.getX(i) + v.x * dt, p.getY(i) + v.y * dt, p.getZ(i) + v.z * dt); v.multiplyScalar(.96); }); p.needsUpdate = true; b.pts.material.opacity = Math.max(0, b.life / b.max); }
  bursts = bursts.filter(b => { if (b.life <= 0) { scene.remove(b.pts); b.pts.geometry.dispose(); return false; } return true; });
  for (const w of waves) { w.life -= dt; const k = 1 - w.life / w.max; w.m.scale.setScalar(1 + k * w.size); w.m.material.opacity = Math.max(0, (1 - k) * .6); }
  waves = waves.filter(w => { if (w.life <= 0) { scene.remove(w.m); return false; } return true; });
  for (const f of floats) { f.life -= dt; f.o.position.y = f.y + (1 - f.life / f.max) * 8; f.o.element.style.opacity = Math.min(1, f.life / f.max * 2); }
  floats = floats.filter(f => { if (f.life <= 0) { scene.remove(f.o); return false; } return true; });
  // camera: follow focused planet, shake on big events
  if (focus && planets.has(focus.sid)) targetGoal.copy(focus.pos); else if (focus) { focus = null; targetGoal.set(0, 0, 0); }
  controls.target.lerp(targetGoal, focus ? .08 : .04);
  if (focus && camera.position.distanceTo(focus.pos) > 45) camera.position.lerp(tmp.copy(focus.pos).add(new THREE.Vector3(18, 14, 26)), .04);
  controls.update();
  if (shake > 0) { shake = Math.max(0, shake - dt * 1.8); camera.position.add(tmp.set(rand(-1, 1), rand(-1, 1), rand(-1, 1)).multiplyScalar(shake * .8)); }
  // labels + HUD (a few times a second)
  if (t - labelTick > .2) {
    labelTick = t;
    for (const P of planets.values()) {
      const col = ST[P.status], n = [...ships.values()].filter(S => S.P === P).length;
      P.lab.element.innerHTML = `<b>${esc(nameOf(P))}</b><i style="color:${col};border-color:${col}">${ST_W[P.status]}</i>` +
        (P.act ? `<span>${esc(clip(P.act, 34))}</span>` : '') + (focus === P && P.prompt ? `<em>“${esc(clip(P.prompt, 80))}”</em>` : '') + (n ? `<span class="s">🚀 ${n} in orbit</span>` : '');
    }
    const act = [...planets.values()].filter(p => p.status === 'working').length, wait = [...planets.values()].filter(p => p.status === 'waiting').length;
    hudStats.innerHTML = `<span><b>${planets.size}</b> planets</span><span><b>${ships.size}</b> ships</span><span><b>${act}</b> active</span>` +
      `<span${wait ? ' class="warn"' : ''}><b>${wait}</b> need you</span><span><b>${stats.tools}</b> tool calls</span><span><b>${beams.length}</b> in flight</span>`;
    const load = document.getElementById('glCoreLoad'); if (load) load.textContent = planets.size ? `load ${Math.min(99, 12 + act * 18 + ships.size * 9)}%` : 'idle';
  }
  if (!wrap.offsetParent) return;
  composer.render(); labelRenderer.render(scene, camera);
}
frame();

window.galaxyAPI = api;
(window.galaxyQueue || []).splice(0).forEach(([k, args]) => api[k](...args));
document.getElementById('glLoading').remove();
</script>
